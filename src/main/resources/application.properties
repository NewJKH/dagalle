spring.application.name=dagalle

# ── MySQL (운영) ──────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/dagalle?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ───────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── H2 (로컬 개발 — local 프로파일에서 override) ──────────
spring.h2.console.enabled=false

# ── Redis ─────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── JWT ───────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:dagalle-secret-key-must-be-at-least-32-characters-long!!}
jwt.access-token-expiry=1800000
jwt.refresh-token-expiry=604800000

# ── External API ──────────────────────────────────────────
external.kakao.key=${KAKAO_API_KEY:}
external.kakao.base-url=https://dapi.kakao.com
external.claude.key=${CLAUDE_API_KEY:}
external.claude.model=claude-opus-4-7
