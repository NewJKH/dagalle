spring:
  application:
    name: dagalle

  datasource:
    url: jdbc:mysql://localhost:3306/dagalle?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  h2:
    console:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

jwt:
  secret: ${JWT_SECRET:dagalle-secret-key-must-be-at-least-32-characters-long}
  access-token-expiry: 1800000    # 30분
  refresh-token-expiry: 604800000  # 7일

external-api:
  kakao:
    key: ${KAKAO_API_KEY:}
    base-url: https://dapi.kakao.com
  google:
    key: ${GOOGLE_API_KEY:}
    places-url: https://places.googleapis.com/v1
    directions-url: https://maps.googleapis.com/maps/api/directions/json
  claude:
    key: ${CLAUDE_API_KEY:}
    model: claude-opus-4-7

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:dagalle;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
