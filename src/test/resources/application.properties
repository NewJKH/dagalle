# 테스트 전용 설정.
#
# 문제: 기본 프로파일이 MySQL·Redis를 보기 때문에, 로컬에 그것들이 없으면
#       `./gradlew test` 가 Connection refused 로 실패했다.
#       테스트는 외부 의존 없이 항상 돌아야 한다.
#
# 왜 .properties 인가: 이 프로젝트는 application.properties 와 application.yml 을
#       둘 다 두고 있고, Spring Boot 는 .properties 를 .yml 보다 우선한다.
#       src/test/resources 의 이 파일이 main 의 application.properties 를 가리고,
#       남는 main/application.yml 의 값들은 여기서 다시 덮는다.
#
# 실제 API 키를 여기에 넣지 말 것 — 이 파일은 git 에 추적된다.

spring.application.name=dagalle-test

# ── H2 인메모리 ───────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:dagalle-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ── JPA ───────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ── Redis 제외 — TokenStore 가 InMemory 구현으로 떨어진다 ──
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

# ── JWT (테스트용 더미) ───────────────────────────────────
jwt.secret=test-only-secret-must-be-at-least-32-characters-long
jwt.access-token-expiry=1800000
jwt.refresh-token-expiry=604800000

# ── 외부 API — 테스트에서 호출하지 않는다. 빈 생성만 되면 된다 ──
external.claude.key=test-dummy
external.claude.model=claude-sonnet-4-5
external.kakao.key=test-dummy
external.kakao.base-url=https://dapi.kakao.com
external-api.claude.key=test-dummy
external-api.google.key=test-dummy
external-api.kakao.key=test-dummy
